replicaCount: 1

image:
  repository: harbor.local/vibetribe/backend
  tag: ""  
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-auth

service:
  type: ClusterIP
  port: 8080

env:
  SPRING_DATASOURCE_URL: jdbc:postgresql://vibetribe-postgres:5432/vibetribe_db
  SPRING_DATASOURCE_USERNAME: vibetribe_user
  SPRING_DATASOURCE_PASSWORD: vibetribe_pass

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: backend.vibetribe.local
      paths:
        - path: /
          pathType: Prefix

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

