replicaCount: 1

image:
  repository: harbor.local/vibetribe/frontend
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: harbor-auth

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: frontend.vibetribe.local
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

